name: Python CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:

      # Step 1:
      # Download the repository code
      # into the GitHub Actions machine.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2:
      # Install the required Python version.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3:
      # Upgrade pip.
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # Step 4:
      # Install Python dependencies.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Step 5:
      # Run automated tests.
      - name: Run tests
        run: |
          pytest -v

      # Step 6:
      # Check that Python files do not contain
      # syntax errors.
      - name: Check Python syntax
        run: |
          python -m compileall .

      # Step 7:
      # Run the actual application.
      - name: Run application
        run: |
          python main.py